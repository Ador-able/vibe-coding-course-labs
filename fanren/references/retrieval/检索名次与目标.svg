<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1740" viewBox="0 0 1600 870"><rect width="1600" height="870" fill="#f8f7f2"/><g font-family="Microsoft YaHei, sans-serif" fill="#26352c"><text x="90" y="95" font-size="34" font-weight="600">同一问题，两路名次，再核完整目标</text><text x="90" y="147" font-size="22" fill="#607166">青岚宗课堂编写排名 · RRF按名次融合，原分数另行保留</text><rect x="90" y="206" width="660" height="326" rx="20" fill="#e8eee7"/><rect x="850" y="206" width="660" height="326" rx="20" fill="#e9edf1"/><text x="128" y="265" font-size="28">关键词路</text><text x="890" y="265" font-size="28">向量路</text><g font-size="25"><text x="128" y="328">1　A1 · 当前钥匙设定　原分9</text><text x="128" y="400">2　A2 · 开门动作　　　原分4</text><text x="128" y="472">3　A7 · 楼顶位置　　　原分0</text><text x="890" y="328">1　A2 · 开门动作　　原分0.82</text><text x="890" y="400">2　A1 · 当前设定　　原分0.78</text><text x="890" y="472">3　A3 · 玄七木牌异常　原分0.71</text></g><path d="M420 545 V583 H1160 V545 M790 583 V627" fill="none" stroke="#7b8b7e" stroke-width="3"/><rect x="90" y="650" width="1420" height="143" rx="20" fill="#fff" stroke="#d4ddd2"/><text x="128" y="701" font-size="25">A1与A2同分；A7仍有1/63贡献，零原分不会自动消失。</text><text x="128" y="750" font-size="23" fill="#607166">Q3还要核玄七异常与支线采用状态：检索相关、排名靠前，都不代替两个对象的完整证据。</text></g></svg>
name: 课程实验检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.12.0
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter model-mechanics-lab --filter ai-request-lab -r test

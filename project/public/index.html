<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资料切块回查</title>
  <link rel="stylesheet" href="style.css" />
 </head>
 <body data-direction="original">
  <header class="toolbar">
   <span class="brand">资料切块回查</span>
   <details class="direction-tools"><summary>页面方向</summary>
    <div role="group" aria-label="同一份数据的页面方向">
     <button type="button" data-direction="original" aria-pressed="true">原版</button>
     <button type="button" data-direction="desk" aria-pressed="false">台面</button>
     <button type="button" data-direction="notes" aria-pressed="false">笔记页</button>
    </div>
   </details>
  </header>
  <main>
   <header class="page-heading"><h1>命中了词，也带回了条件吗？</h1><p>看完整返回材料，再回到对应原页判断。</p></header>
   <form id="locate-form" class="query-form">
    <label>切分方式<select id="method" disabled></select></label>
    <label class="query-label">字面查询<input id="query" value="卡住" required /></label>
    <button id="locate" type="submit" disabled>查看返回材料</button>
   </form>
   <p id="status" role="status">正在读取固定观察。</p>
   <div class="workspace">
    <section class="reading" aria-label="返回材料与真实回答">
     <div id="document-heading"></div>
     <div id="hits"></div>
     <section class="text-page"><h3>交给回答的完整材料</h3><div id="context" class="extracted-text"></div></section>
     <section class="text-page"><h3>这次真实问答</h3><p id="question" class="question-text"></p><div id="answer" class="extracted-text"></div></section>
    </section>
    <section class="source" aria-label="原文件页面">
     <div class="source-title"><h2 id="page-title">原页</h2><a id="image-link" target="_blank" rel="noopener" hidden>放大原页</a></div>
     <div id="page-buttons" class="page-buttons"></div>
     <div id="source-page"></div>
     <details class="original-text"><summary>完整25段文字</summary><div id="full-body" class="extracted-text"></div></details>
    </section>
   </div>
   <details class="technical"><summary>全部小块、命中与来源位置</summary><div id="all-chunks"></div><pre id="selection-record"></pre></details>
   <details class="technical"><summary>完整观察与下载</summary>
    <a href="chunks.json" download>下载完整切分记录</a><a href="answers.json" download>下载完整问答记录</a>
    <a id="file-download" download>下载对应PDF</a><a href="original-body.txt" download>下载完整文字</a>
    <pre id="raw-record"></pre>
   </details>
   <p class="scope">本页读取固定真实观察。改变切法或页面方向不会再次调用模型。字面命中不是语义排名；回答仍需回查原文。</p>
  </main>
  <script type="module" src="main.js"></script>
 </body>
</html>

<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>检索候选回查</title>
  <link rel="stylesheet" href="style.css" />
 </head>
 <body data-direction="original">
  <header class="toolbar">
   <span class="brand">检索候选回查</span>
   <details class="direction-tools"><summary>页面方向</summary>
    <div role="group" aria-label="同一份数据的页面方向">
     <button type="button" data-direction="original" aria-pressed="true">原版</button>
     <button type="button" data-direction="desk" aria-pressed="false">台面</button>
     <button type="button" data-direction="notes" aria-pressed="false">笔记页</button>
    </div>
   </details>
  </header>
  <main>
   <header class="page-heading"><h1>同一问题，两路找资料</h1><p>选中候选，回查完整原文能支持什么。</p></header>
   <form id="locate-form" class="query-form">
    <label class="query-label">问题<select id="query" disabled></select></label>
    <label>资料范围<select id="condition" disabled><option value="base">原始范围</option><option value="filtered">精确编号</option></select></label>
    <button id="locate" type="submit" disabled>回查原文</button>
   </form>
   <p id="status" role="status">正在读取固定观察。</p><button id="retry" type="button" hidden>重新载入记录</button>
   <div class="workspace">
    <section class="reading" aria-label="检索候选与完整材料">
     <p id="question" class="question-text"></p><p id="range" class="document-label"></p>
     <div id="rank-lists" class="rank-lists"></div>
     <div id="document-heading"></div>
     <section class="text-page"><h3>选中块的完整文字</h3><div id="context" class="extracted-text"></div><p id="locator" class="locator-caption"></p></section>
    </section>
    <section class="source" aria-label="原文件页面">
     <div class="source-title"><h2 id="page-title">原页</h2><a id="image-link" target="_blank" rel="noopener" hidden>放大原页</a></div>
     <p id="source-status" class="document-label">回查原文后显示来源。</p>
     <div id="page-buttons" class="page-buttons"></div>
     <div id="source-page"></div>
     <details class="original-text"><summary>来源完整文字</summary><div id="full-body" class="extracted-text"></div></details>
    </section>
   </div>
   <details class="technical"><summary>分词、分数、融合与来源位置</summary><pre id="selection-record"></pre></details>
   <details id="record-details" class="technical"><summary>完整观察与下载</summary>
    <a href="observation.json" download>下载完整检索记录</a>
    <a id="file-download" download hidden>下载对应原文件</a><a href="original-body.txt" download>下载完整第三章文字</a>
    <pre id="raw-record"></pre>
   </details>
   <p class="scope">本页只读取实际检索记录，不生成回答或保存章节。小说资料是历史草稿；四份便签是课堂构造。切换方向不会改变候选或再次调用模型。</p>
  </main>
  <script type="module" src="main.js"></script>
 </body>
</html>

<!doctype html>
<html lang="zh-CN">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回答与当时依据</title>
  <link rel="stylesheet" href="style.css" />
 </head>
 <body data-direction="original">
  <header class="toolbar">
   <span class="brand">回答与依据</span>
   <details class="direction-tools"><summary>页面方向</summary>
    <div role="group" aria-label="同一份数据的页面方向">
     <button type="button" data-direction="original" aria-pressed="true">原版</button>
     <button type="button" data-direction="desk" aria-pressed="false">台面</button>
     <button type="button" data-direction="notes" aria-pressed="false">笔记页</button>
    </div>
   </details>
  </header>
  <main>
   <header class="page-heading"><h1>这句话依据哪一份资料</h1><p>看完整回答，再回到它当时收到的原文。</p></header>
   <form id="locate-form" class="query-form">
    <label>回答<select id="answer" disabled></select></label>
    <label>来源<select id="source" disabled></select></label>
    <button id="locate" type="submit" disabled>查看依据</button>
   </form>
   <p id="status" role="status">正在读取保存的记录。</p><button id="retry" type="button" hidden>重新载入记录</button>
   <div class="workspace">
    <section class="reading" aria-label="当前选中回答">
     <p id="question" class="question-text"></p>
     <p id="version" class="document-label"></p>
     <div id="answer-text" class="extracted-text answer-text"></div>
     <p id="answer-state" class="document-label"></p>
     <details class="technical"><summary>这轮完整提示与标签检查</summary><pre id="prompt-record"></pre></details>
    </section>
    <section class="source" aria-label="回答当时的原文依据">
     <div class="source-title"><h2 id="source-title">原文依据</h2><a id="file-download" download hidden>下载完整便签</a></div>
     <p id="source-status" class="document-label">选择来源并查看依据。</p>
     <div id="source-page"></div>
     <p id="locator" class="locator-caption"></p>
    </section>
   </div>
   <details class="technical"><summary>当前资料替换与实际检索</summary><pre id="update-record"></pre></details>
   <details class="technical"><summary>完整记录与下载</summary>
    <a href="answer-observation.json" download>下载完整业务记录</a>
    <pre id="raw-record"></pre>
   </details>
   <p class="scope">只读取保存的回答与来源，切换和回查不会再次请求模型。便签是课堂构造；标签能定位，陈述是否得到支持仍需人核对。</p>
  </main>
  <script type="module" src="main.js"></script>
 </body>
</html>

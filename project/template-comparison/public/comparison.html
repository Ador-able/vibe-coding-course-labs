<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整批模板核对</title><link rel="stylesheet" href="style.css"><script src="comparison.js" defer></script></head>
<body data-direction="original">
 <header class="toolbar"><span class="brand">整批模板核对</span><details class="direction-tools"><summary>显示方式</summary><div><button type="button" data-direction="original" aria-pressed="true">原版</button><button type="button" data-direction="desk" aria-pressed="false">工作台面</button><button type="button" data-direction="notes" aria-pressed="false">工作笔记</button></div></details></header>
 <main>
  <div class="page-heading"><h1>同一批材料，逐项回查</h1><p>先看原文与字段，再核整批汇总和文件。六项标题的末句号归属仍待人确认。</p></div>
  <p id="status" role="status">正在读取保存结果。</p>
  <nav class="item-list" aria-label="提示版本"><button type="button" data-version="V1" aria-pressed="true">V1</button><button type="button" data-version="V2" aria-pressed="false">V2</button></nav>
  <nav id="items" class="item-list" aria-label="日报记录"></nav>
  <div class="workspace">
   <section class="reading"><h2 id="selected-title">记录</h2><p id="item-status"></p><h3>字段与完整证据</h3><pre id="result"></pre><details class="text-page"><summary>查看机械检查</summary><pre id="check"></pre></details></section>
   <section class="source"><h2>本项完整原文</h2><pre id="original" class="extracted-text"></pre></section>
  </div>
  <details class="technical" id="summary-panel"><summary>整批汇总与 CSV 结果</summary><p id="export-status"></p><pre id="summary"></pre><div id="downloads"></div><pre id="csv-result"></pre></details>
  <details class="technical"><summary>完整原答与请求结果</summary><pre id="whole"></pre><pre id="report"></pre></details>
  <p class="scope">教师编写的练习日报。检查、文件读回和人工采用分别判断；此页不执行模型或真实投放。</p>
 </main>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说工作台 · 草稿</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body>
  <div id="app">
    <header class="work-heading"><h1 id="work-title">读取作品</h1></header>
    <div class="workspace">
      <aside class="navigation"><h2>章节</h2><nav id="chapters" aria-label="章节"></nav><details id="context"><summary>作品资料</summary><div id="work-context"></div></details></aside>
      <main class="draft-panel">
        <header class="draft-heading"><div><span id="chapter-label">当前草稿</span><p id="revision"></p></div><div class="actions"><p id="edit-state"></p><button id="reload" type="button">重新读取</button><button id="save" class="primary" type="submit" form="draft-form" disabled>保存草稿</button></div></header>
        <form id="draft-form">

        <section class="feedback" aria-live="polite"><div><p id="message" role="status">正在读取当前稿件。</p><details id="error-detail" hidden><summary>错误详情</summary><code id="error-code"></code></details></div><button id="read-current" type="button" hidden>读取当前稿</button></section>
<label class="title-label" for="draft-title">章名</label><input id="draft-title" name="title" required><label class="body-label" for="draft-body">正文</label><textarea id="draft-body" name="body" required spellcheck="false"></textarea>

        </form>

        <section id="comparison" hidden><header><h3 id="remote-heading">当前已保存稿</h3><button id="use-current" type="button">以当前稿重新编辑</button></header><p>本地修改仍保留在上方。请先对照当前稿，再决定如何合并。</p><label for="remote-body">当前已保存正文</label><textarea id="remote-body" readonly></textarea></section>
      </main>
    </div>
  </div>

</body></html>
